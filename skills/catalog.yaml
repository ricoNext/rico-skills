# 供人类与脚本检索的 skill 索引（路径相对本仓库根目录）
version: 1
skills:
  - id: writing-style-learn
    path: skills/writing-style-learn
    name: 作者行文风格（学习写入）
    description: >-
      从纯文本或网页 URL（抓取正文后）归纳行文习惯，按作者写入固定目录 ~/.rico-skills/author-writing-style/profiles。
      不含多本地文件与目录批量导入；套用档案请用 writing-style-apply。
    tags: [writing, chinese, style, learn, profile]
  - id: writing-style-apply
    path: skills/writing-style-apply
    name: 作者行文风格（应用套用）
    description: >-
      读取 ~/.rico-skills/author-writing-style/profiles 下已建档的行文习惯，改写或生成中文内容。
      不写入档案；建档请用 writing-style-learn。
    tags: [writing, chinese, style, rewrite, apply]
  - id: tutor
    path: skills/tutor
    name: 互动学习导师
    description: >-
      指导用户学习、练习、检验或长期追踪任意技能与知识主题；通过真实场景、犯错模拟、漏洞检测、
      压力测试、反向教学、推理审计和学习路径设计帮助用户逼近真正掌握。
    tags: [learning, tutoring, practice, mastery]
  - id: yapi-sync
    path: skills/yapi-sync
    name: YApi 接口同步
    description: >-
      从 YApi 读取接口定义并生成/更新项目中的 API 和 TypeScript 类型，支持单个、批量及分类列表同步。
    tags: [api, yapi, typescript, codegen]
  - id: backend-api-sync
    path: skills/backend-api-sync
    name: 后端接口同步
    description: >-
      根据 Java Spring MVC 后端源码中的 RequestMapping 路径定位 Controller，生成符合前端项目规范的 API 函数与完整 TypeScript 类型。
    tags: [api, backend, java, typescript, codegen]
  - id: gacp
    path: skills/gacp
    name: 快速提交并推送
    description: >-
      快速提交并推送代码（git add . + git commit + git push），由 Agent 根据改动自动生成中文 Conventional Commit 信息。
    tags: [git, commit, push, conventional-commits]
